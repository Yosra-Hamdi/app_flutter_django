
services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: python manage.py runserver 0.0.0.0:8000
    
    depends_on:
      - db
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Yosra1103*/
      POSTGRES_DB: db_django_flutter
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  pgloader:
    image: dimitri/pgloader
    volumes:
      - ./data:/data              # Monte le dossier contenant db.sqlite3
    networks:
      - default
    command: >
      sh -c "sleep 10 && pgloader /data/migrate.load"

    depends_on:
      - db
volumes:
  postgres_data:

networks:
  default: